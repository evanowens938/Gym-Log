<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gym Log</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym Log">
<style>
:root{--bg:#eef0f3;--card:#fff;--ink:#161a22;--mute:#6b7380;--line:#dde1e7;--accent:#2f5bea;--onacc:#fff;--danger:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1218;--card:#1a1f29;--ink:#eef1f6;--mute:#8d96a5;--line:#2a313e;--accent:#6f93ff;--onacc:#0f1218;--danger:#ff7b6b}}
:root[data-theme="dark"]{--bg:#0f1218;--card:#1a1f29;--ink:#eef1f6;--mute:#8d96a5;--line:#2a313e;--accent:#6f93ff;--onacc:#0f1218;--danger:#ff7b6b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
main{max-width:520px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:8px 0 2px}
h2{font-size:15px;font-weight:700;margin:22px 0 8px;color:var(--mute)}
.sub{color:var(--mute);font-size:14px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-width:0}
input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;gap:8px;margin-top:8px}
label{font-size:12px;color:var(--mute);display:block;margin-bottom:3px}
.btn{width:100%;margin-top:10px;font:inherit;font-weight:700;font-size:16px;background:var(--accent);color:var(--onacc);border:0;border-radius:10px;padding:12px;cursor:pointer}
.x{background:none;border:0;color:var(--mute);font-size:20px;line-height:1;padding:4px 8px;cursor:pointer}
.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item b{font-weight:700}.item span{color:var(--mute);font-size:14px}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.dayhead b{font-size:16px}.dayhead span{color:var(--mute);font-size:13px}
.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.plan{display:flex;gap:10px;align-items:center}
.plan .d{width:44px;font-weight:800}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;border:0;font:inherit;font-weight:700;font-size:14px;color:var(--mute);padding:10px 4px;border-radius:10px;cursor:pointer}
nav button[aria-selected="true"]{color:var(--accent);background:var(--bg)}
.empty{color:var(--mute);font-size:14px;padding:6px 0}
.note{font-size:12px;color:var(--mute);margin-top:18px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <section id="plan" hidden>
    <h1>Weekly plan</h1>
    <p class="sub">What are you training each day?</p>
    <div class="card" id="planCard"></div>
    <p class="note">Everything is saved on this device, in this browser.</p>
  </section>

  <section id="workouts">
    <h1>Workouts</h1>
    <p class="sub" id="todayPlan"></p>
    <div class="card">
      <label for="wEx">Exercise</label>
      <input id="wEx" placeholder="Bench press" autocomplete="off">
      <div class="row">
        <div><label for="wSets">Sets</label><input id="wSets" type="number" inputmode="numeric" placeholder="3"></div>
        <div><label for="wReps">Reps</label><input id="wReps" type="number" inputmode="numeric" placeholder="8"></div>
        <div><label for="wKg">Weight</label><input id="wKg" type="number" inputmode="decimal" placeholder="60"></div>
      </div>
      <button class="btn" id="addW">Add exercise</button>
    </div>
    <div id="wList"></div>
  </section>

  <section id="meals" hidden>
    <h1>Meals</h1>
    <p class="sub">Log what you ate today.</p>
    <div class="card">
      <label for="mName">Meal</label>
      <input id="mName" placeholder="Chicken and rice" autocomplete="off">
      <div class="row">
        <div><label for="mCal">Calories</label><input id="mCal" type="number" inputmode="numeric" placeholder="650"></div>
        <div><label for="mPro">Protein (g)</label><input id="mPro" type="number" inputmode="numeric" placeholder="45"></div>
      </div>
      <button class="btn" id="addM">Add meal</button>
    </div>
    <div id="mList"></div>
  </section>
</main>

<nav role="tablist">
  <button role="tab" data-t="workouts" aria-selected="true">Workouts</button>
  <button role="tab" data-t="meals" aria-selected="false">Meals</button>
  <button role="tab" data-t="plan" aria-selected="false">Plan</button>
</nav>

<script>
var DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
var S={workouts:[],meals:[],plan:{}};
function load(){try{var r=localStorage.getItem("gymlog");if(r){var d=JSON.parse(r);S.workouts=d.workouts||[];S.meals=d.meals||[];S.plan=d.plan||{};}}catch(e){}}
function save(){try{localStorage.setItem("gymlog",JSON.stringify(S));}catch(e){}}
function dstr(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function dayIdx(){return (new Date().getDay()+6)%7;}
function nice(s){var p=s.split("-");var d=new Date(+p[0],+p[1]-1,+p[2]);return d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function group(list){var g={};list.forEach(function(x){(g[x.date]=g[x.date]||[]).push(x);});return Object.keys(g).sort().reverse().map(function(k){return [k,g[k]];});}

function renderW(){
  var t=S.plan[DAYS[dayIdx()]];
  document.getElementById("todayPlan").textContent=t?"Today’s plan: "+t:"No plan set for today. Add one in Plan.";
  var h=group(S.workouts).map(function(p){
    return '<div class="card"><div class="dayhead"><b>'+nice(p[0])+'</b><span>'+p[1].length+' exercise'+(p[1].length>1?'s':'')+'</span></div>'+
    p[1].map(function(x){return '<div class="item"><div><b>'+esc(x.ex)+'</b><br><span>'+(x.sets||"–")+' × '+(x.reps||"–")+(x.kg?' at '+x.kg:'')+'</span></div><button class="x" aria-label="Delete" data-del="w" data-id="'+x.id+'">×</button></div>';}).join("")+'</div>';
  }).join("");
  document.getElementById("wList").innerHTML=h||'<p class="empty">No workouts logged yet. Add your first exercise above.</p>';
}
function renderM(){
  var h=group(S.meals).map(function(p){
    var cal=0,pro=0;p[1].forEach(function(x){cal+=+x.cal||0;pro+=+x.pro||0;});
    return '<div class="card"><div class="dayhead"><b>'+nice(p[0])+'</b><span>'+cal+' kcal · '+pro+' g protein</span></div>'+
    p[1].map(function(x){return '<div class="item"><div><b>'+esc(x.name)+'</b><br><span>'+(x.cal?x.cal+' kcal':'')+(x.cal&&x.pro?' · ':'')+(x.pro?x.pro+' g protein':'')+'</span></div><button class="x" aria-label="Delete" data-del="m" data-id="'+x.id+'">×</button></div>';}).join("")+'</div>';
  }).join("");
  document.getElementById("mList").innerHTML=h||'<p class="empty">No meals logged yet. Add your first meal above.</p>';
}
function renderP(){
  document.getElementById("planCard").innerHTML=DAYS.map(function(d,i){
    return '<div class="plan" style="margin:'+(i?'10px':'0')+' 0 0"><span class="d" style="color:'+(i===dayIdx()?'var(--accent)':'inherit')+'">'+d+'</span><input data-day="'+d+'" placeholder="Rest" value="'+esc(S.plan[d]||"")+'" aria-label="'+d+' workout"></div>';
  }).join("");
}

document.getElementById("addW").onclick=function(){
  var ex=document.getElementById("wEx").value.trim();if(!ex){document.getElementById("wEx").focus();return;}
  S.workouts.push({id:Date.now(),date:dstr(),ex:ex,sets:document.getElementById("wSets").value,reps:document.getElementById("wReps").value,kg:document.getElementById("wKg").value});
  save();renderW();
  ["wEx","wSets","wReps","wKg"].forEach(function(i){document.getElementById(i).value="";});
};
document.getElementById("addM").onclick=function(){
  var n=document.getElementById("mName").value.trim();if(!n){document.getElementById("mName").focus();return;}
  S.meals.push({id:Date.now(),date:dstr(),name:n,cal:document.getElementById("mCal").value,pro:document.getElementById("mPro").value});
  save();renderM();
  ["mName","mCal","mPro"].forEach(function(i){document.getElementById(i).value="";});
};
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-del]");if(!b)return;
  var id=+b.dataset.id;
  if(b.dataset.del==="w"){S.workouts=S.workouts.filter(function(x){return x.id!==id;});renderW();}
  else{S.meals=S.meals.filter(function(x){return x.id!==id;});renderM();}
  save();
});
document.addEventListener("input",function(e){
  var d=e.target.dataset&&e.target.dataset.day;if(!d)return;
  S.plan[d]=e.target.value;save();renderW();
});
document.querySelectorAll("nav button").forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll("nav button").forEach(function(x){x.setAttribute("aria-selected",x===b);});
    ["workouts","meals","plan"].forEach(function(s){document.getElementById(s).hidden=(s!==b.dataset.t);});
    window.scrollTo(0,0);
  };
});
load();renderW();renderM();renderP();
</script>
</body>
</html>
